name: Build and Auto-Update

on:
    push:
        branches: ["main"]

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "9.0.x"

            - name: Publish Executable
              run: dotnet publish "league auto client.csproj" -c Release -r win-x64 -p:Version=1.0.${{ github.run_number }} -p:PublishReferencesDocumentationFiles=false -o ./publish

            - name: Zip Artifact
              uses: vimtor/action-zip@v1
              with:
                  files: ./publish/
                  dest: league-auto-client-win-x64.zip

            - name: Create Versioned GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v1.0.${{ github.run_number }}
                  name: Release v1.0.${{ github.run_number }}
                  files: |
                      league-auto-client-win-x64.zip
                      ./publish/league auto client.exe
                  body: "Automated build for commit ${{ github.sha }}"
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate and Commit updates.xml
              shell: pwsh
              run: |
                  $version = "1.0.${{ github.run_number }}"
                  $xml = @"
                  <?xml version="1.0" encoding="UTF-8"?>
                  <item>
                      <version>$version</version>
                      <url>https://github.com/${{ github.repository }}/releases/latest/download/league-auto-client-win-x64.zip</url>
                      <changelog>https://github.com/${{ github.repository }}/releases</changelog>
                      <mandatory>false</mandatory>
                  </item>
                  "@
                  Set-Content -Path "updates.xml" -Value $xml -Encoding UTF8

                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --global --add safe.directory "$PWD"
                  git add updates.xml
                  git commit -m "chore: auto-update updates.xml to version $version"
                  git push
